[project]
name = "notifications-service"
version = "0.1.0"
description = "Notifications-микросервис mgnbvbooking: слушает события в RabbitMQ и рассылает email-уведомления владельцам"
authors = [
    {name = "Magomednabiev",email = "efregh@list.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.115.0,<0.116.0)",
    "uvicorn[standard] (>=0.32.0,<0.33.0)",
    "pydantic (>=2.9.0,<3.0.0)",
    "pydantic-settings (>=2.5.2,<3.0.0)",
    "aiosmtplib (>=3.0.0,<4.0.0)",
    "aio-pika (>=9.4.0,<10.0.0)",
]

[tool.poetry]
name = "notifications"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
packages = [{include = "app"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
