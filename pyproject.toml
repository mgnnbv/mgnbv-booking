[project]
name = "mgnbvbooking"
version = "0.1.0"
description = "Бэкенд сервиса учёта аренды (посуточная + долгосрочная)"
authors = [
    {name = "Magomednabiev", email = "efregh@list.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115.0,<0.116.0)",
    "uvicorn[standard] (>=0.32.0,<0.33.0)",
    "sqlalchemy[asyncio] (>=2.0.36,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "alembic (>=1.13.3,<2.0.0)",
    "pydantic (>=2.9.0,<3.0.0)",
    "pydantic-settings (>=2.5.2,<3.0.0)",
    "python-jose[cryptography] (>=3.3.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (==4.0.1)",
    "cryptography (>=43.0.0,<44.0.0)",
    "redis (>=5.0.0,<6.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"
pytest-asyncio = ">=0.24.0,<0.25.0"
httpx = ">=0.27.0,<0.28.0"

[tool.poetry]
name = "mgnbvbooking"
version = "0.1.0"
description = "Backend для сервиса учёта аренды"
authors = ["Your Name <you@example.com>"]
packages = [{include = "booking"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
